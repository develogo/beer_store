name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Build, push and update stacks
        uses: develogo/git-actions/actions/build_push_and_update_stacks@v1
        with:
          image_name: beer-store
          image_repo: develogo/beer-store
          stacks_repo: develogo/stacks
          stacks_compose_path: stacks/flutter-demos/docker-compose.yml
          stacks_repo_token: ${{ secrets.STACKS_REPO_TOKEN }}
          dockerfile_path: Dockerfile
          context: .
          platforms: linux/amd64
          enable_qemu: auto
